<app-mapa-3d
  [eixos]="eixos()"
  [locais]="locais()"
  [projetos]="projetos()"
  [visiveis]="idsVisiveis()"
  [selecionado]="selecionado()"
  (selecionar)="selecionar($event)" />

<header class="top">
  <div class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
      <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
    </svg>
  </div>
  <div>
    <h1>Mapa da Sustentabilidade</h1>
    <p>UFRJ · Cidade Universitária (Ilha do Fundão)</p>
  </div>
</header>

<app-sidebar
  [eixos]="eixos()"
  [locais]="locais()"
  [projetos]="filtrados()"
  [total]="projetos().length"
  [filtroEixo]="filtroEixo()"
  [busca]="busca()"
  [exemplo]="dadosDeExemplo()"
  [selecionadoId]="selecionado()?.id ?? null"
  (filtrar)="filtrar($event)"
  (buscar)="buscar($event)"
  (selecionar)="selecionar($event)" />

<app-detalhe
  [projeto]="selecionado()"
  [eixo]="eixoSelecionado()"
  [local]="localSelecionado()"
  (fechar)="fechar()" />

@if (carregando()) {
  <div class="aviso">Carregando projetos…</div>
}
@if (erro(); as msg) {
  <div class="aviso erro">{{ msg }}</div>
}

<div class="hint">Arraste para girar · role para aproximar · clique em um ponto</div>
@if (!selecionado()) {
  <button class="reset" (click)="visaoGeral()">↺ Visão geral</button>
}
